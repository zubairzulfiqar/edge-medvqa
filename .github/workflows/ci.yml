name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -q tests/test_metrics.py

  real-model-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('medvqa/model.py', 'medvqa/data.py') }}
          restore-keys: hf-
      - name: Install CPU PyTorch and the package
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,edge]"
      - name: int8 quantisation backends
        run: pytest -v tests/test_compress.py
      - name: SmolVLM-256M on VQA-RAD - LoRA steps, evaluation, int8 compression
        env:
          RUN_MODEL_TESTS: "1"
        run: pytest -v -s tests/test_pipeline.py
